site_name: Kuali Connector
site_description: Documentation for the Kuali Connector — download, install, and use the Kuali command-line tool.
site_url: https://kualico.github.io/kuali-connector/
repo_url: https://github.com/kualico/kuali-connector
repo_name: kualico/kuali-connector
edit_uri: edit/main/docs/
copyright: Copyright &copy; Kuali, Inc.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Install:
      - installation/index.md
      - macOS: installation/macos.md
      - Windows: installation/windows.md
      - Linux: installation/linux.md
  - Guides:
      - guides/index.md
      - First connection: guides/first-connection.md
      - Common tasks: guides/common-tasks.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - reference/index.md
      - Commands: reference/commands.md
  - FAQ: faq.md
  - Support: support.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kualico/kuali-connector
    - icon: fontawesome/solid/globe
      link: https://kuali.co
