site_name: Kuali Connector
site_description: Documentation for the Kuali Connector — download, install, and use the Kuali command-line tool.
site_url: https://connector.kuali.co/
repo_url: https://github.com/kualico/kuali-connector
repo_name: kualico/kuali-connector
edit_uri: edit/main/docs/
copyright: Copyright &copy; Kuali, Inc.

theme:
  name: material
  logo: assets/kuali-logo-white.png
  favicon: assets/favicon.png
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
    - scheme: slate
      primary: custom
      accent: custom
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/theme-toggle.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Install:
      - installation/index.md
      - macOS: installation/macos.md
      - Windows: installation/windows.md
      - Linux: installation/linux.md
  - Guides:
      - guides/index.md
      - Prompt library: guides/prompts.md
      - Claude Desktop: guides/claude-desktop.md
      - Claude Code: guides/claude-code.md
      - Other AI clients: guides/other-clients.md
      - Read-only mode: guides/read-only-mode.md
      - First connection: guides/first-connection.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - reference/index.md
      - CLI commands: reference/commands.md
      - MCP tools: reference/mcp-tools.md
  - FAQ: faq.md
  - Support: support.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kualico/kuali-connector
    - icon: fontawesome/solid/globe
      link: https://kuali.co
